# Точка входа Nginx для магазина «ПУЛЬС».
# Раздел 12 ТЗ: единая точка входа, gzip, кэш статики, быстрый ответ API.

# ── Почему адреса сервисов заданы переменными, а не через upstream ──
# Nginx резолвит имена контейнеров ОДИН раз при старте. После
# `docker compose up --build` контейнер получает новый IP, а Nginx продолжает
# обращаться к старому и отдаёт 502, хотя сервис здоров — приходилось
# перезапускать Nginx вручную после каждой пересборки.
#
# С `resolver 127.0.0.11` (встроенный DNS Docker) и переменной в proxy_pass
# имя пере-resолвится само. Плата: при переменной в proxy_pass URI
# передаётся как есть, поэтому подставлять путь в директиве нельзя —
# ниже везде proxy_pass без URI-части.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

# Лимит запросов на один IP: базовая защита от лавины (раздел 10 ТЗ).
# Nginx считает грубо и не различает аккаунты, поэтому порог высокий: за одним
# публичным IP (офис, оператор связи) сидят десятки покупателей. Точная защита
# от подбора пароля живёт в Redis на бэкенде, где лимит начисляется на связку
# «IP + email».
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

# По умолчанию Nginx отвечает на превышение лимита кодом 503, и клиент не может
# отличить «сервис сломан» от «слишком быстро». Отдаём 429.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    set $frontend_upstream "frontend:3000";
    set $backend_upstream "backend:8000";

    client_max_body_size 12m;
    root /var/www/html;

    # Healthcheck самого Nginx.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Статика с хешем в имени — можно кэшивать на год ──
    location /assets/ {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── API ──
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Верхний порог на маршруты авторизации.
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # Swagger и ReDoc удобнее смотреть напрямую.
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ── SSR-рендеринг витрины ──
    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}