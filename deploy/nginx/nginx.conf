user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Секреты и токены из заголовков не пишем в access.log (раздел 10 ТЗ).
    log_format pulse '$remote_addr - $request_id [$time_local] "$request" '
                     '$status $body_bytes_sent $request_time "$http_referer"';
    access_log /var/log/nginx/access.log pulse;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;
    client_max_body_size 12m;

    # Gzip — обязателен по разделу 12 ТЗ.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}