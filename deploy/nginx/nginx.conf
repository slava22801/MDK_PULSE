user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Секреты и токены из заголовков не пишем в access.log (раздел 10 ТЗ).
    log_format pulse '$remote_addr - $request_id [$time_local] "$request" '
                     '$status $body_bytes_sent $request_time "$http_referer"';
    access_log /var/log/nginx/access.log pulse;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;
    client_max_body_size 12m;

    # Исходный Host с портом. Переменная $host теряет порт: «localhost:8090»
    # превращается в «localhost». Это ломает проверку origin у React Router —
    # он сверяет хост из заголовка Origin с Host/X-Forwarded-Host, и при
    # несовпадении обрывает ЛЮБУю POST-форму с 400 ещё до запуска action'а
    # (из-за этого не работают ни вход, ни корзина, ни оформление заказа).
    # Пустой Host бывает только у HTTP/1.0 без заголовка — подставляем
    # $host:$server_port, чтобы переменная никогда не оказалась пустой.
    map $http_host $origin_host {
        ""       $host:$server_port;
        default  $http_host;
    }

    # Gzip — обязателен по разделу 12 ТЗ.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}